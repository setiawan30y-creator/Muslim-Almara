# Nginx — ALMARA MUSLIM (@2026-Alifiandra)
# Salin ke /etc/nginx/sites-available/almara, ganti "domain-anda.id", lalu aktifkan.
# Sertifikat HTTPS ditambahkan otomatis oleh: sudo certbot --nginx -d domain-anda.id
server {
    listen 80;
    listen [::]:80;
    server_name domain-anda.id;
    root /var/www/almara/public;
    index index.php;
    charset utf-8;

    # Unggahan rekaman qari (sesuaikan dengan ALMARA_AUDIO_MAX_MB)
    client_max_body_size 200M;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Service worker & manifest dibuat dinamis oleh Laravel — jangan dicache lama
    location = /service-worker.js { try_files $uri /index.php?$query_string; }
    location = /manifest.webmanifest { try_files $uri /index.php?$query_string; }

    location ~* \.(?:css|js|png|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
